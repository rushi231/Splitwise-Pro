version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: splitwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
      POSTGRES_DB: splitwise
    ports:
      - "5432:5432"
    volumes:
      - splitwise_pgdata:/var/lib/postgresql/data

volumes:
  splitwise_pgdata:
